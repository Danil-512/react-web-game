# Файл конфигурации - контейнеры с nginx последней версии и couchdb версии 1.7.2

# Указание версии нужно для старых версий docker
#version: '3.8'

# Описание всех частей приложения, которые будут запускаться в контейнерах
services:

  postgres_db:
    image: postgres:17-alpine
    container_name: postgres_to_django
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${MAIN_DATABASE_USER}
      POSTGRES_PASSWORD: ${MAIN_DATABASE_PASSWORD}
      POSTGRES_MULTIPLE_DATABASES: ${MAIN_DATABASE_NAME},${MAIN_DATABASE_LAWS_NAME}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Файл для создания второй базы данных - MAIN_DATABASE_LAWS_NAME
      - ./init-multiple-databases.sh:/docker-entrypoint-initdb.d/init-multiple-databases.sh
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MAIN_DATABASE_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Запуск команды для выдачи прав доступа на файл скрипта создания баз данных
    # +x - добавить право на выполнение файла
    # exec - заменяет текущий процесс на новый процесс
    #   новый процесс - docker-entrypoint.sh (стандартный скрипт инициализации образа постгреса)
    # postgres в конце - говорит запустить сервер постгреса
    command: >
      sh -c "
      chmod +x /docker-entrypoint-initdb.d/init-multiple-databases.sh
      && exec docker-entrypoint.sh postgres
      && echo "host all all 172.0.0.0/8 scram-sha-256" >> /var/lib/postgresql/data/pg_hba.conf
      "

  front_react:
    build:
      context: ./frontend-react
      dockerfile: Dockerfile
    image: react_front_image:latest
    container_name: react_front
    env_file:
      - .env
    # ports:
    #   - '${FRONT_SERVER_PORT}:${FRONT_SERVER_PORT}'
    depends_on:
      - back_django_main
    volumes:
      - react_static:/app/dist
      - ./frontend-react:/app
      - /app/node_modules
    networks:
      - app_network
    command: sh -c "npm install && npm run build && tail -f /dev/null"


  back_django_main:
    build:
      context: ./django-to-react
      dockerfile: Dockerfile
    image: django_main_image:latest
    container_name: django_main
    env_file:
      - .env
    ports:
      - '${VITE_MAIN_BACK_SERVER_PORT}:${VITE_MAIN_BACK_SERVER_PORT}'
    volumes:
      - ./django-to-react:/app
    depends_on:
      postgres_db:
        condition: service_healthy
      redisdb:
        condition: service_healthy
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s


  back_django_laws:
    build:
      context: ./django-rest-laws
      dockerfile: Dockerfile
    image: django_laws_image:latest
    container_name: django_laws
    env_file:
      - .env
    ports:
      - '${VITE_LAWS_BACK_SERVER_PORT}:${VITE_LAWS_BACK_SERVER_PORT}'
    volumes:
      - ./django-rest-laws:/app
    depends_on:
      back_django_main:
        condition: service_healthy
      postgres_db:
        condition: service_healthy
    networks:
      - app_network


  redisdb:
    # Образ контейнера СУБД
    image: redis:8.2-alpine
    # Название контейнера
    #container_name: redis_to_django
    # Используемые порты.
    ports:
      - '${REDIS_PORT}:6379'
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
  
  #nginx
  nginx:
    # Образ контейнера nginx
    image: nginx:alpine
    container_name: nginx_to_react
    # Используемые порты. Первый - внешний сервера, второй - внутренний контейнера 
    # Nginx - это http веб-сервер, поэтому использую стандартный http порт
    ports:
      - '80:80'
    # Установка своей конфигурации. Также позволит редактировать конфигурацию без пересоздания контейнера
    # В файле nginx.conf укажу перенаправление с 80 порта на порт 5173
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - react_static:/usr/share/nginx/html:ro
    # Указание nginx ожидать запуска front_react
    depends_on:
      - front_react
    networks:
      - app_network

volumes:
  redis_data:
  postgres_data:
  react_static:

networks:
  app_network:
    driver: bridge


# Сборка проекта
# docker-compose build
#
# Запуск проекта
# docker-compose up
#
# Остановить и удалить контейнеры созданные через docker-compose up
# docker-compose down
#
# Посмотреть список конетйнеров
# docker-compose ps
#
# Посмотреть список образов
# docker-compose images