http {
  # Не передавать версию nginx в заголовках
  server_tokens off;
  #
  server {
    # Прослушиваемый порт
    listen 80;
    #
    # Запросы к какому домену будут обрабатываться
    server_name localhost 512server.ru;
    #
    # Адреса фронта
    location / {
      root /usr/share/nginx/html;
      index index.html index.htm;
      try_files $uri $uri/ /index.html;
    }
    #
    # Адреса центрального сервиса бэка
    location ~ ^/(auth|reg|get_actual_user|get-csrf|check-session|debug/sessions)/ {
      proxy_pass http://back_django_main:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Original-URI $request_uri;
    }
    #
    # Health check для мониторинга центрального бэка
    location /health/ {
      proxy_pass http://back_django_main:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Health check для мониторинга законодательства бэка
    location /health2/ {
      proxy_pass http://back_django_laws:7000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Документация API (swagger/redoc) ценрального бэка
    location ~ ^/(swagger|redoc|api/docs)/ {
      proxy_pass http://back_django_main:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
    #
    # Адреса сервиса законодательства бэка
    location /rest_api/ {
      proxy_pass http://back_django_laws:7000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Original-URI $request_uri;
    }
  }
}